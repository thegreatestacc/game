name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test and build launcher and game
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: ./scripts/build-windows.ps1 -Version $env:RELEASE_VERSION -Repository $env:RELEASE_REPOSITORY
      - name: Publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release create $env:RELEASE_VERSION --verify-tag --draft --title "SpellGame $env:RELEASE_VERSION" --generate-notes dist/SpellGame-Launcher.exe dist/SpellGame-game.exe dist/release-manifest.json dist/FONT-LICENSE.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed. A draft may remain; inspect it before retrying.' }
          gh release edit $env:RELEASE_VERSION --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }

